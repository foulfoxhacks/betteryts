<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>BetterYTS Stream overlay</title>
		<!-- OBS browser source. Never indexed (also /_headers /stream*). The credential stays in the #fragment. -->
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<style>
			html, body { margin: 0; background: transparent; color: #fff; font: 600 20px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000c; }
			.box { display: inline-grid; gap: 6px; padding: 12px 16px; border-radius: 12px; background: #0009; max-width: 640px; }
			.label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
			.now { display: flex; gap: 12px; align-items: center; }
			.now img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; }
			.by { font-weight: 400; opacity: .85; font-size: 16px; }
			ol { margin: 0; padding-left: 22px; font-size: 16px; font-weight: 500; }
			[hidden] { display: none !important; }
		</style>
	</head>
	<body>
		<div class="box" id="overlay" hidden>
			<div class="label" id="now-label">Now playing</div>
			<div class="now"><img id="art" alt="" hidden /><div><div id="title"></div><div class="by" id="by"></div></div></div>
			<div class="label" id="next-label" hidden>Up next</div>
			<ol id="next"></ol>
			<div class="by" id="hint"></div>
		</div>
		<script type="module" src="/web/stream-overlay.js"></script>
	</body>
</html>
