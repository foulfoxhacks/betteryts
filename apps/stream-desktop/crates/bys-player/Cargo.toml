[package]
name = "bys-player"
description = "Pear Desktop playback destination for BetterYTS Stream (verified queue adds, no write retries)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", optional = true, default-features = false }

[lints]
workspace = true
