[package]
name = "bys-obs"
description = "OBS control for BetterYTS Stream over obs-websocket v5 (loopback only)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# All already in the dependency tree (no new crates): tungstenite (WebSocket), sha2 + data-encoding
# (obs-websocket's SHA-256 / base64 login), serde_json.
[dependencies]
serde_json = "1"
sha2 = "0.10"
data-encoding = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
