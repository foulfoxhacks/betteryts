<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="referrer" content="no-referrer" />
		<title>BetterYTS Stream overlay</title>
		<style>
			html, body { margin: 0; background: transparent; color: #fff; font: 600 20px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000c; }
			.box { display: inline-grid; gap: 6px; padding: 12px 16px; border-radius: 12px; background: #0009; max-width: 640px; }
			.now { display: flex; gap: 12px; align-items: center; }
			.now img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
			.small { font-size: 15px; font-weight: 500; opacity: .85; }
			#alert { font-size: 24px; font-weight: 800; color: #ffc857; }
			[hidden] { display: none !important; }
		</style>
	</head>
	<body>
		<div class="box" id="box" hidden>
			<div class="now"><img id="art" alt="" hidden /><div><div id="title"></div><div class="small" id="artist"></div></div></div>
			<div class="small" id="line"></div>
			<div class="small" id="trigger"></div>
			<div id="alert" hidden></div>
		</div>
		<script>
			// Token from the #fragment: never sent to any server, sent only to this local app in a header.
			const token = location.hash.slice(1);
			const $ = (id) => document.getElementById(id);
			async function poll() {
				try {
					const r = await fetch("/state", { headers: { "X-Overlay-Token": token }, cache: "no-store" });
					if (r.ok) {
						const s = await r.json();
						$("box").hidden = !s.live && !s.nowPlaying && !s.alert;
						$("title").textContent = s.nowPlaying ? s.nowPlaying.title : "Live";
						$("artist").textContent = s.nowPlaying ? s.nowPlaying.artist : "";
						const art = s.nowPlaying && s.nowPlaying.artwork;
						$("art").hidden = !art;
						if (art) $("art").src = art;
						const watching = (s.audience || []).reduce((n, a) => n + a[1], 0);
						$("line").textContent = [s.requestsOpen ? `Requests open · ${s.queueLength} in queue` : "Requests paused", watching ? `${watching} watching` : ""].filter(Boolean).join(" · ");
						$("trigger").textContent = s.lastTrigger || "";
						$("alert").hidden = !s.alert;
						$("alert").textContent = s.alert || "";
					}
				} catch {}
				setTimeout(poll, 2000);
			}
			if (/^[a-f0-9]{64}$/.test(token)) poll();
		</script>
	</body>
</html>
