[package]
name = "betteryts-stream"
description = "BetterYTS Stream Desktop: live requests, queue and automation console"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "betteryts-stream"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bys-stream-api = { path = "../crates/bys-stream-api" }
bys-store = { path = "../crates/bys-store" }
bys-player = { path = "../crates/bys-player" }
# tauri: native window + system WebView (WebView2 / WebKitGTK), MSI/deb bundling.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
