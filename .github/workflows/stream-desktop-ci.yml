# BetterYTS Stream Desktop (Rust): format, lint, tests and dependency advisories.
name: Stream Desktop CI

on:
  push:
    branches: [main]
    paths: ["apps/stream-desktop/**", ".github/workflows/stream-desktop-ci.yml"]
  pull_request:
    paths: ["apps/stream-desktop/**", ".github/workflows/stream-desktop-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stream-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/stream-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit
