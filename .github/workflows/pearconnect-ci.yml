# Moved from apps/pearconnect/.github/workflows/ci.yml when PearConnect joined the BetterYTS monorepo.
# Runs only for changes under apps/pearconnect/ (and this file); commands run from that folder.
name: PearConnect CI
on:
  push:
    branches: [main]
    paths: ['apps/pearconnect/**', '.github/workflows/pearconnect-ci.yml']
  pull_request:
    paths: ['apps/pearconnect/**', '.github/workflows/pearconnect-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pearconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/pearconnect/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run check:streamerbot
  streamerbot:
    name: Streamer.bot C# contract / Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pearconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts
      - run: npm run test:streamerbot
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/pearconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
  desktop:
    name: Desktop acceptance and Windows portable build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pearconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/pearconnect/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run test:desktop
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: PearConnect-Windows-x64-preview
          path: apps/pearconnect/dist/PearConnect-win32-x64/
          if-no-files-found: error
          retention-days: 14
